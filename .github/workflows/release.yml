name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: shellcaster
            asset: shellcaster-linux-x86_64

          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: shellcaster.exe
            asset: shellcaster-windows-x86_64.exe

          - name: macos-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            bin: shellcaster
            asset: shellcaster-macos-x86_64

          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            bin: shellcaster
            asset: shellcaster-macos-aarch64

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --features sqlite_bundled --target ${{ matrix.target }}

      - name: Prepare Unix executable
        if: runner.os != 'Windows'
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/${{ matrix.bin }} dist/${{ matrix.asset }}

      - name: Prepare Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/${{ matrix.bin }} dist/${{ matrix.asset }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          archive: false

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
